version: 2

# Try using these source definitions instead!
sources:
  - name: shopify
    schema: "{{ target.schema }}_raw"
    description: shopify raw data loaded from API
    tables:
      - name: raw_shopify_customers
        description: Raw customer data from Shopify
        config:
          loaded_at_field: ingested_at

      - name: raw_shopify_orders
        description: Raw order data from Shopify
        config:
          loaded_at_field: ingested_at
        columns:
          - name: order_id
            description: Unique identifier for each order
          - name: updated_at
            description: shopify updated timestamp for the order
          - name: payload_json
            description: The full JSON payload from the Shopify API for this order
      
      - name: raw_shopify_products
        description: Raw product data from Shopify
        config:
          loaded_at_field: ingested_at

  - name: ga4
    schema: analytics_534648282
    description: Raw GA4 BigQuery export data
    tables:
      - name: events
        identifier: events_*
        description: One record per event, with nested parameters and user properties
        columns:
          - name: event_name
            description: The name of the event
          - name: event_timestamp
            description: The timestamp of the event in microseconds since the Unix epoch
          - name: event_date
            description: The date of the event in YYYYMMDD format
          - name: user_pseudo_id
            description: A unique identifier for the user, generated by GA4
          - name: event_params
            description: A repeated record containing key-value pairs of event parameters
          - name: items
            description: A repeated record containing key-value pairs of product items in the event