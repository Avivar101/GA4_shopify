version: 2

models:
  - name: fct__funnel
    description: >
      Daily growth funnel mart by source, medium, and campaign. This model
      summarizes GA4 session behavior and joins matched Shopify order revenue
      from the purchase reconciliation model.
    columns:
      - name: event_date
        description: Date of the session, derived from GA4 session_start_at.
        tests:
          - not_null

      - name: source
        description: Traffic source for the session group.
        tests:
          - not_null

      - name: medium
        description: Traffic medium for the session group.
        tests:
          - not_null

      - name: campaign
        description: Campaign for the session group.
        tests:
          - not_null

      - name: sessions
        description: Number of distinct sessions.
        tests:
          - not_null

      - name: page_view_sessions
        description: Number of sessions with at least one page_view event.

      - name: view_item_sessions
        description: Number of sessions with at least one view_item event.

      - name: add_to_cart_sessions
        description: Number of sessions with at least one add_to_cart event.

      - name: checkout_sessions
        description: Number of sessions with at least one begin_checkout event.

      - name: ga4_purchase_sessions
        description: Number of sessions with at least one GA4 purchase event.

      - name: matched_purchase_sessions
        description: Number of sessions with at least one GA4 purchase matched to a Shopify order.

      - name: matched_orders
        description: Number of matched Shopify orders attributed to sessions in this group.

      - name: shopify_revenue
        description: Matched Shopify revenue generated by sessions in this group.

      - name: session_to_view_item_rate
        description: Share of sessions that viewed at least one product.

      - name: view_item_to_cart_rate
        description: Share of product-view sessions that added at least one item to cart.

      - name: cart_to_checkout_rate
        description: Share of add-to-cart sessions that began checkout.

      - name: checkout_to_purchase_rate
        description: Share of checkout sessions that had a matched Shopify purchase.

      - name: session_to_purchase_rate
        description: Share of sessions that had a matched Shopify purchase.

      - name: revenue_per_session
        description: Matched Shopify revenue divided by sessions.

  - name: fct__attributed_orders
    description: >
      Reporting-ready order fact table with Shopify revenue truth and
      purchase-session attribution fields from matched GA4 purchases.
    columns:
      - name: order_id
        description: Shopify order ID. The grain is one row per Shopify order.
        tests:
          - not_null
          - unique

      - name: order_created_date
        description: Shopify order created date used for revenue reporting.
        tests:
          - not_null

      - name: ga4_purchase_date
        description: Date of the matched GA4 purchase event, when attribution exists.

      - name: total_price
        description: Shopify order total.
        tests:
          - not_null

      - name: is_attributed
        description: Boolean flag for whether the order has matched GA4 attribution.
        tests:
          - not_null

      - name: attributed_source
        description: Source assigned under purchase-session attribution.
        tests:
          - not_null

      - name: attributed_medium
        description: Medium assigned under purchase-session attribution.
        tests:
          - not_null

      - name: attributed_campaign
        description: Campaign assigned under purchase-session attribution.
        tests:
          - not_null

  - name: fct__channel_revenue
    description: >
      Daily attributed revenue mart grouped by Shopify order date, currency,
      attributed source, medium, and campaign. Revenue remains Shopify-truth;
      GA4 provides the attribution dimensions.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - revenue_date
              - currency
              - attributed_source
              - attributed_medium
              - attributed_campaign
    columns:
      - name: revenue_date
        description: Shopify order created date used as the revenue reporting date.
        tests:
          - not_null

      - name: currency
        description: Shopify order currency.
        tests:
          - not_null

      - name: attributed_source
        description: Source assigned under purchase-session attribution.
        tests:
          - not_null

      - name: attributed_medium
        description: Medium assigned under purchase-session attribution.
        tests:
          - not_null

      - name: attributed_campaign
        description: Campaign assigned under purchase-session attribution.
        tests:
          - not_null

      - name: orders
        description: Number of Shopify orders in the group.
        tests:
          - not_null

      - name: total_revenue
        description: Shopify total order revenue in the group.
        tests:
          - not_null

      - name: order_attribution_coverage_rate
        description: Share of orders in the group that have GA4 attribution.

      - name: revenue_attribution_coverage_rate
        description: Share of revenue in the group that has GA4 attribution.
