name: shopify_ga4

profile: shopify_ga4

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  shopify_ga4:
    +schema: seeds

models:
  shopify_ga4:
    +persist_docs:
      relation: true
      columns: true
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: view


vars:
  transform_batch_no: "{{ run_started_at.strftime('%Y%m%d%H%MS') }}"
